[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && LD_LIBRARY_PATH=/root/.nix-profile/lib:$LD_LIBRARY_PATH python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[nixpacks]
provider = "python"
